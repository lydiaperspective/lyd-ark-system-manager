[package]
name = "ark-system-manager"
version = "0.1.0"
edition = "2021"
description = "System management CLI for Lyd Ark"
license = "MIT"

[[bin]]
name = "ark-system-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"
